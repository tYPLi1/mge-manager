<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <style>
      html, body { background: #0a0e1a; margin: 0; padding: 0; color: #0a0e1a; }
      body > *:not(#root):not(script):not(#initial-splash):not([data-radix-popper-content-wrapper]):not([data-radix-portal]):not([data-sonner-toaster]):not([data-radix-toast-viewport]) { display: none !important; }
      #initial-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #0a0e1a;
        display: flex; align-items: center; justify-content: center;
        color: #f59e0b;
      }
      #initial-splash .spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      body.app-ready #initial-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="initial-splash"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var root = document.getElementById('root');
        if (!root) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            document.body.classList.add('app-ready');
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
  </body>
</html>
